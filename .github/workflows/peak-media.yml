# peak-media on every supported OS (DEC-53): macOS, Windows x64, Linux x64. Runs the platform
# subset of the evals plus one end-to-end smoke test; the full eval suite stays a local macOS run.
name: peak-media

on:
  pull_request:
    branches: [develop]
    paths:
      - 'plugins/peak-media/**'
      - '.github/workflows/peak-media.yml'
  push:
    branches: [develop]
    paths:
      - 'plugins/peak-media/**'
      - '.github/workflows/peak-media.yml'
  workflow_dispatch:

concurrency:
  group: peak-media-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: write # each OS posts one comment linking its smoke video

jobs:
  evals:
    name: evals (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      PM: plugins/peak-media
    steps:
      - uses: actions/checkout@v4

      # the plugin data dir (the runner context isn't available in job-level env)
      - name: Data dir
        run: |
          echo "CLAUDE_PLUGIN_DATA=$RUNNER_TEMP/peak-media-data" >> "$GITHUB_ENV"
          echo "PEAK_MEDIA_SMOKE_OUT=$RUNNER_TEMP/smoke-out" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Install ffmpeg and Chromium's system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx --yes playwright@1.65.0 install-deps chromium

      - name: Restore the runtime cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CLAUDE_PLUGIN_DATA }}
            ~/.cache/hyperframes
          key: pm-runtime-${{ runner.os }}-${{ hashFiles('plugins/peak-media/package-lock.json', 'plugins/peak-media/lib/pins.json') }}

      - name: Setup
        run: node "$PM/scripts/setup.mjs"

      - name: Evals (platform subset + smoke)
        run: |
          node --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination=test-output.tap \
            "$PM/evals/platform/*.test.mjs" \
            "$PM/evals/verify/verify-tools.test.mjs" \
            "$PM/evals/contracts/*.test.mjs" \
            "$PM/evals/trace/*.test.mjs" \
            "$PM/evals/packaging/packaging.test.mjs" \
            "$PM/evals/smoke/smoke.test.mjs"

      # the smoke test's final.mp4, uploaded as the bare file (no zip) so it plays from the link
      - name: Find the smoke video
        id: video
        if: always()
        run: |
          f=$(ls "$PEAK_MEDIA_SMOKE_OUT"/*.mp4 2>/dev/null | head -1)
          echo "file=$f" >> "$GITHUB_OUTPUT"
      - name: Upload the smoke video
        id: upload
        if: always() && steps.video.outputs.file != ''
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.video.outputs.file }}
          archive: false
      - name: Comment the smoke video on the PR
        if: always() && github.event_name == 'pull_request' && steps.upload.outputs.artifact-url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.upload.outputs.artifact-url }}
          OUTCOME: ${{ job.status }}
          OS: ${{ matrix.os }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker="<!-- peak-media-smoke-$OS -->"
          body="$marker
          **peak-media smoke video — $OS** (${SHA:0:7}, run ${{ github.run_number }}, $OUTCOME)

          ▶ [$(basename "${{ steps.video.outputs.file }}")]($URL)

          setup → render a plate → capture the example deck → assemble → check-take, no API key."
          body=$(printf '%s\n' "$body" | sed 's/^          //')
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}
          path: |
            test-output.tap
            ${{ env.CLAUDE_PLUGIN_DATA }}/deps/*/*.log
          if-no-files-found: ignore

<!doctype html>
<!-- peak-media default outro (3 s, 1280x720, 30 fps): the logo and a name fade in, hold, then fade out.
     Rendered like a plate: copy this file to <dir>/index.html, the brand pack to <dir>/brand/,
     and the local GSAP to <dir>/vendor/gsap.min.js (DEC-09: GSAP is never shipped or loaded from a CDN).
     Replace the name text with your own when you copy this pack. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, height=720">
<link rel="stylesheet" href="brand/tokens.css">
<script src="vendor/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: var(--color-bg); }
  #root { width: 100%; height: 100%; color: var(--color-fg); font-family: var(--font-display); }
  #stage { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-4); }
  #logo { width: 160px; height: 160px; opacity: 0; }
  #name { font-size: var(--size-title); font-weight: var(--weight-display); letter-spacing: -0.01em; opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <div id="stage" class="clip" data-start="0" data-duration="3" data-track-index="0">
    <img id="logo" src="brand/logo.svg" alt="">
    <div id="name">Your Name</div>
  </div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#logo", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 0.2);
  tl.fromTo("#name", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.45);
  tl.to(["#logo", "#name"], { opacity: 0, duration: 0.5, ease: "power2.in" }, 2.4);
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>

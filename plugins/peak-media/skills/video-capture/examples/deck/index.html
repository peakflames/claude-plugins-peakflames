<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Water in the morning</title>
<style>
  :root { --bg: #f4f1ea; --fg: #1f2421; --muted: #5d665f; --accent: #2f7d5b; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  /* 200 ms fades: a slower fade spreads the change over many frames and check-take's scene
     detector (threshold 0.02) no longer sees the slide change it has to place in silence */
  .slide { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center;
    padding: 0 12%; opacity: 0; transform: translateY(24px); transition: opacity 200ms ease, transform 200ms ease; }
  .slide.active { opacity: 1; transform: none; }
  .kicker { color: var(--accent); font-size: 22px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin: 0 0 18px; }
  h1 { font-size: 72px; line-height: 1.05; margin: 0 0 28px; }
  ul { margin: 0; padding: 0; list-style: none; }
  li { font-size: 34px; line-height: 1.4; margin: 0 0 14px; color: var(--muted); }
  li b { color: var(--fg); }
  .bar { position: absolute; left: 12%; right: 12%; bottom: 3%; height: 6px; background: #dcd6c8; border-radius: 3px; }
  .bar i { display: block; height: 100%; width: 33.3%; background: var(--accent); border-radius: 3px; transition: width 200ms ease; }
  .num { position: absolute; right: 12%; top: 8%; font-size: 22px; color: var(--muted); }
</style>
</head>
<body>
  <section class="slide active" data-n="0">
    <p class="kicker">Garden basics</p>
    <h1>Water in the morning</h1>
    <ul><li>One habit, three reasons.</li></ul>
  </section>
  <section class="slide" data-n="1">
    <p class="kicker">Why mornings</p>
    <h1>Less is lost</h1>
    <ul>
      <li><b>Cool air:</b> less water evaporates.</li>
      <li><b>Dry leaves by noon:</b> less mildew.</li>
    </ul>
  </section>
  <section class="slide" data-n="2">
    <p class="kicker">How</p>
    <h1>Aim at the roots</h1>
    <ul>
      <li>Water the soil, not the leaves.</li>
      <li>Water deeply, then let it dry.</li>
    </ul>
  </section>
  <div class="num" id="num">1 / 3</div>
  <div class="bar"><i id="bar"></i></div>
<script>
  // deckGo(n): show slide n (0-based). The storyboard calls it through page.evaluate.
  window.deckGo = (n) => {
    const slides = document.querySelectorAll('.slide');
    const i = Math.max(0, Math.min(slides.length - 1, Number(n) || 0));
    slides.forEach((s, k) => s.classList.toggle('active', k === i));
    document.getElementById('num').textContent = `${i + 1} / ${slides.length}`;
    document.getElementById('bar').style.width = `${((i + 1) / slides.length) * 100}%`;
    return i;
  };
</script>
</body>
</html>
